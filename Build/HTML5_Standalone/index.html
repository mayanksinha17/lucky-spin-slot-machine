<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LUCKY SPIN – Ultimate Anime Casino Slot Machine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-stage">
        <div id="game-container">
            <!-- 1. Ambient Background Layer -->
            <div id="casino-bg"></div>

            <!-- 2. Decorative Anime Hostess Character (Left) -->
            <div id="hostess-panel">
                <img src="Assets/Art/Characters/anime_hostess.png" alt="Anime Casino Hostess" id="hostess-img">
            </div>

            <!-- 3. Decorative Anime Spade Silhouette (Right) -->
            <div id="spade-deco-panel">
                <img src="Assets/Art/Characters/anime_spade_deco.png" alt="Neon Spade Anime Silhouette" id="spade-img">
            </div>

            <!-- 4. Decorative Coin Stacks (Bottom Corners) -->
            <div id="coin-stacks-left">
                <img src="Assets/Art/UI/coin_stacks_decor.png" alt="Gold Coins & Casino Chips">
            </div>
            <div id="coin-stacks-right">
                <img src="Assets/Art/UI/coin_stacks_decor.png" alt="Gold Coins & Casino Chips">
            </div>

            <!-- 5. Top Left Balance HUD Badge -->
            <div id="balance-hud">
                <div class="hud-coin-icon">
                    <span>$</span>
                </div>
                <div id="balance-display">1,000 G</div>
            </div>

            <!-- 6. Top Right Controls (Sound, History, Win Streak) -->
            <div id="top-controls">
                <div id="streak-badge" class="streak-badge">🔥 2x WIN STREAK!</div>
                <button id="btn-history" title="View Spin History" class="btn-icon">📜</button>
                <button id="btn-mute" title="Toggle Sound" class="btn-icon">🔊</button>
            </div>

            <!-- 7. Central Slot Machine Cabinet -->
            <main id="cabinet-wrapper">
                <!-- Crown & Title Marquee -->
                <div id="title-marquee">
                    <div class="crown-icon">👑</div>
                    <div class="marquee-ribbon">
                        <span class="marquee-title">LUCKY SPIN</span>
                        <span class="marquee-sub">JACKPOT</span>
                    </div>
                    <div class="diamond-gem">💎</div>
                </div>

                <!-- 3-Reel Window Aperture -->
                <div id="reel-aperture">
                    <div id="payline"></div>

                    <!-- Reel 1 (Left) -->
                    <div class="reel-frame" id="reel-frame-1">
                        <div id="reel-strip-1" class="reel-strip">
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png" alt="Cherry"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Bell"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png" alt="BAR"></div>
                        </div>
                    </div>

                    <!-- Reel 2 (Center) -->
                    <div class="reel-frame" id="reel-frame-2">
                        <div id="reel-strip-2" class="reel-strip">
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Bell"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png" alt="BAR"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png" alt="Cherry"></div>
                        </div>
                    </div>

                    <!-- Reel 3 (Right) -->
                    <div class="reel-frame" id="reel-frame-3">
                        <div id="reel-strip-3" class="reel-strip">
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png" alt="BAR"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Bell"></div>
                            <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Bell"></div>
                        </div>
                    </div>

                    <!-- Result Notification Banner (Pop-in upon outcome) -->
                    <div id="banner-container">
                        <div id="win-banner">
                            <div id="banner-title" class="win-title">NO MATCH</div>
                            <div id="banner-amount" class="win-amount">TRY AGAIN!</div>
                        </div>
                    </div>
                </div>

                <!-- Status Indicator Capsule -->
                <div id="status-capsule">
                    <div id="status-text">READY TO SPIN</div>
                </div>
            </main>

            <!-- 8. Lower Interactive Deck & Spin Button -->
            <footer id="lower-deck">
                <!-- Bet Control Deck -->
                <div id="bet-deck-container">
                    <button id="btn-bet-minus" class="btn-deck-stepper" title="Decrease Bet">−</button>
                    <div id="bet-display-box">
                        <span id="bet-display">BET 10 G</span>
                    </div>
                    <button id="btn-bet-plus" class="btn-deck-stepper" title="Increase Bet">+</button>

                    <!-- Bet Presets -->
                    <button class="btn-quick-bet active" data-bet="10">10</button>
                    <button class="btn-quick-bet" data-bet="50">50</button>
                    <button class="btn-quick-bet" data-bet="100">100</button>
                    <button id="btn-max-bet" class="btn-preset-max">MAX</button>
                    <button id="btn-auto-spin" class="btn-preset-auto">AUTO</button>
                </div>

                <!-- Large Circular Spin Button -->
                <div id="spin-button-wrapper">
                    <button id="btn-spin" title="Spin Reels (Spacebar)">
                        <span class="spin-text">SPIN</span>
                    </button>
                </div>
            </footer>

            <!-- 9. Golden Coin Particle Canvas -->
            <canvas id="particle-canvas" width="1920" height="1080"></canvas>

            <!-- 10. Slide-Out History Drawer -->
            <div id="history-drawer">
                <div class="history-header">
                    <h3>Spin History</h3>
                    <button id="btn-close-history" class="btn-icon">✕</button>
                </div>
                <div id="history-summary">Spins: 0 | Wins: 0 (0%)</div>
                <div id="history-items"></div>
            </div>

            <!-- 11. Arcade Jackpot Celebration Modal -->
            <div id="jackpot-modal">
                <div class="jackpot-content">
                    <div class="jackpot-marquee">💎 JACKPOT! 💎</div>
                    <div id="jackpot-amount">+2500 G</div>
                    <p>DIAMOND TRIPLE MATCH!</p>
                    <button class="btn-collect">COLLECT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
