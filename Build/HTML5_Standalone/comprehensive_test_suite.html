<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUCKY SPIN – Comprehensive Standalone HTML5 In-Browser Test Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="header">
            <div class="brand-title">LUCKY SPIN</div>
            <div id="streak-badge" class="streak-badge">🔥 2x WIN STREAK!</div>
            <div class="audio-controls">
                <button id="btn-history">📜 History</button>
                <button id="btn-mute">🔊</button>
            </div>
        </header>

        <main id="slot-stage">
            <div id="cabinet">
                <div id="payline"></div>
                <div class="reel-frame">
                    <div id="reel-strip-1" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png"></div>
                    </div>
                </div>
                <div class="reel-frame">
                    <div id="reel-strip-2" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_diamond.png"></div>
                    </div>
                </div>
                <div class="reel-frame">
                    <div id="reel-strip-3" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png"></div>
                    </div>
                </div>
            </div>

            <aside id="side-panel">
                <div class="side-title">Quick Bet</div>
                <button class="btn-quick-bet active" data-bet="10">Bet 10G</button>
                <button class="btn-quick-bet" data-bet="50">Bet 50G</button>
                <button class="btn-quick-bet" data-bet="100">Bet 100G</button>
            </aside>
        </main>

        <div id="banner-container">
            <div id="win-banner">
                <div id="banner-title" class="win-title">READY</div>
                <div id="banner-amount" class="win-amount">SPIN TO WIN</div>
            </div>
        </div>

        <footer id="footer">
            <div class="hud-panel">
                <span class="hud-label">CREDITS</span>
                <span id="balance-display" class="hud-value">1000 G</span>
            </div>
            <div class="bet-controls">
                <div class="hud-panel">
                    <span class="hud-label">TOTAL BET</span>
                    <span id="bet-display" class="hud-value">10 G</span>
                </div>
                <button id="btn-bet-minus" class="btn-stepper">-</button>
                <button id="btn-bet-plus" class="btn-stepper">+</button>
                <button id="btn-max-bet" class="btn-secondary">MAX</button>
            </div>
            <div class="action-buttons">
                <button id="btn-auto-spin" class="btn-secondary">AUTO SPIN</button>
                <button id="btn-spin">SPIN</button>
            </div>
        </footer>

        <div id="jackpot-modal">
            <div class="jackpot-content">
                <div class="jackpot-marquee">💎 JACKPOT! 💎</div>
                <div id="jackpot-amount">+2500 G</div>
            </div>
        </div>

        <div id="history-drawer">
            <div class="history-header">
                <h2>SPIN HISTORY</h2>
                <button id="btn-close-history">✕</button>
            </div>
            <div id="history-summary">Spins: 0</div>
            <div id="history-items" class="history-list"></div>
        </div>

        <canvas id="particle-canvas"></canvas>
    </div>

    <!-- Test Results Overlay -->
    <div id="test-results-panel" style="position: absolute; top: 10px; left: 10px; background: rgba(10,5,20,0.92); border: 2px solid #00ffaa; color: #fff; padding: 14px; border-radius: 8px; font-family: monospace; font-size: 12px; z-index: 1000; max-width: 650px; max-height: 90vh; overflow-y: auto;">
        <h3 style="color: #00ffaa; margin-bottom: 6px; font-size: 14px;">HTML5 Standalone Comprehensive Test Suite</h3>
        <div id="test-log">Running tests...</div>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
    <script>
        const testReport = {
            total: 0,
            passed: 0,
            failed: 0,
            tests: []
        };

        function assert(condition, testName, details = '') {
            testReport.total++;
            if (condition) {
                testReport.passed++;
                testReport.tests.push({ name: testName, pass: true, details });
                console.log(`[PASS] ${testName} ${details}`);
            } else {
                testReport.failed++;
                testReport.tests.push({ name: testName, pass: false, details });
                console.error(`[FAIL] ${testName} ${details}`);
            }
            renderReport();
        }

        function renderReport() {
            const div = document.getElementById('test-log');
            if (!div) return;
            div.innerHTML = testReport.tests.map(t => 
                `<div style="color: ${t.pass ? '#00ffaa' : '#ff4444'}; margin-bottom: 2px;">
                    ${t.pass ? '✓ [PASS]' : '✗ [FAIL]'} <strong>${t.name}</strong> ${t.details ? `(${t.details})` : ''}
                </div>`
            ).join('') + 
            `<div style="margin-top: 8px; font-weight: bold; color: ${testReport.failed === 0 ? '#00ffaa' : '#ff4444'};">
                TOTAL: ${testReport.total} | PASSED: ${testReport.passed} | FAILED: ${testReport.failed}
            </div>`;
        }

        function getSymbolByType(type) {
            return SYMBOLS.find(s => s.type === type);
        }

        function runComprehensiveTests() {
            try {
                const gm = window.gameManager;
                gm.isImmediateMode = true; // Use fast synchronous settlement for deterministic test suite

                const cherry = getSymbolByType('Cherry');
                const bell = getSymbolByType('Bell');
                const bar = getSymbolByType('Bar');
                const seven = getSymbolByType('Seven');
                const diamond = getSymbolByType('Diamond');
                const wild = getSymbolByType('Wild');

                // -------------------------------------------------------------
                // TEST 1: Initial Loading & Defaults
                // -------------------------------------------------------------
                assert(gm.getState() === 'Idle', 'T01_InitialState_Idle', `State is ${gm.getState()}`);
                assert(gm.getBalance() === 1000, 'T02_InitialBalance_1000', `Balance is ${gm.getBalance()}`);
                assert(gm.getCurrentBet() === 10, 'T03_InitialBet_10', `Bet is ${gm.getCurrentBet()}`);

                // -------------------------------------------------------------
                // TEST 2: Guaranteed Winning Outcome (Cherry | Cherry | Cherry)
                // -------------------------------------------------------------
                const startBal = gm.getBalance();
                const betAmount = 20;
                gm.requestDeterministicSpin([cherry, cherry, cherry], betAmount);

                assert(gm.reels[0].getVisibleCenterSymbol() === cherry, 'T04_Win_Reel1StoppedOnCherry');
                assert(gm.reels[1].getVisibleCenterSymbol() === cherry, 'T05_Win_Reel2StoppedOnCherry');
                assert(gm.reels[2].getVisibleCenterSymbol() === cherry, 'T06_Win_Reel3StoppedOnCherry');
                assert(gm.getLastResult().isWin === true, 'T07_Win_ResultMarkedAsWin');
                assert(gm.getLastResult().multiplier === 2, 'T08_Win_CherryMultiplierIs2x');
                
                // Debit: 1000 - 20 = 980; Payout: 20 * 2 = 40; Final = 1020
                const expectedBal = startBal - betAmount + (betAmount * 2);
                assert(gm.getBalance() === expectedBal, 'T09_Win_DebitAndPayoutArithmetic', `Expected ${expectedBal}, got ${gm.getBalance()}`);
                assert(gm.getHistory().length === 1 && gm.getHistory()[0].isWin === true, 'T10_Win_HistoryRecordedWin');

                // -------------------------------------------------------------
                // TEST 3: Guaranteed Losing Outcome (Cherry | Bell | Bar)
                // -------------------------------------------------------------
                const preLossBal = gm.getBalance();
                const lossBet = 50;
                gm.requestDeterministicSpin([cherry, bell, bar], lossBet);

                assert(gm.reels[0].getVisibleCenterSymbol() === cherry, 'T11_Loss_Reel1StoppedOnCherry');
                assert(gm.reels[1].getVisibleCenterSymbol() === bell, 'T12_Loss_Reel2StoppedOnBell');
                assert(gm.reels[2].getVisibleCenterSymbol() === bar, 'T13_Loss_Reel3StoppedOnBar');
                assert(gm.getLastResult().isWin === false, 'T14_Loss_ResultMarkedAsLoss');
                assert(gm.getLastResult().multiplier === 0, 'T15_Loss_MultiplierIsZero');
                
                // Debit: 1020 - 50 = 970; Payout: 0; Final = 970
                const expectedLossBal = preLossBal - lossBet;
                assert(gm.getBalance() === expectedLossBal, 'T16_Loss_DebitWithoutPayout', `Expected ${expectedLossBal}, got ${gm.getBalance()}`);
                assert(gm.getHistory().length === 2 && gm.getHistory()[0].isWin === false, 'T17_Loss_HistoryRecordedLoss');

                // -------------------------------------------------------------
                // TEST 4: Wild Symbol Substitution (Seven | Wild | Seven)
                // -------------------------------------------------------------
                const preWildBal = gm.getBalance();
                const wildBet = 10;
                gm.requestDeterministicSpin([seven, wild, seven], wildBet);

                assert(gm.getLastResult().isWin === true, 'T18_Wild_SubstitutionWins');
                assert(gm.getLastResult().isWildAssisted === true, 'T19_Wild_MarkedAsWildAssisted');
                assert(gm.getLastResult().multiplier === 25, 'T20_Wild_SevenMultiplier25xAwarded');
                // Payout: 10 * 25 = 250; Bal: 970 - 10 + 250 = 1210
                assert(gm.getBalance() === preWildBal - wildBet + 250, 'T21_Wild_PayoutSettledAccurately');

                // -------------------------------------------------------------
                // TEST 5: Win Streak Multipliers
                // -------------------------------------------------------------
                // Win 1 just occurred (streak = 1, mult = 1.0)
                assert(gm.winStreak === 1, 'T22_Streak_FirstWinSetsStreak1');
                
                // Win 2 (streak = 2 -> 1.25x)
                gm.requestDeterministicSpin([cherry, cherry, cherry], 10);
                assert(gm.winStreak === 2, 'T23_Streak_SecondWinSetsStreak2');

                // Win 3 (streak = 3 -> 1.50x)
                gm.requestDeterministicSpin([cherry, cherry, cherry], 10);
                assert(gm.winStreak === 3, 'T24_Streak_ThirdWinSetsStreak3');

                // Loss resets streak to 0
                gm.requestDeterministicSpin([cherry, bell, bar], 10);
                assert(gm.winStreak === 0, 'T25_Streak_LossResetsStreakToZero');

                // -------------------------------------------------------------
                // TEST 6: Jackpot Celebration (Diamond | Diamond | Diamond)
                // -------------------------------------------------------------
                gm.requestDeterministicSpin([diamond, diamond, diamond], 10);
                assert(gm.getLastResult().isWin === true, 'T26_Jackpot_DiamondTripleWins');
                assert(gm.getLastResult().multiplier === 100, 'T27_Jackpot_100xMultiplier');
                const modal = document.getElementById('jackpot-modal');
                assert(modal && modal.style.display === 'flex', 'T28_Jackpot_ModalDisplayed');
                modal.style.display = 'none'; // Dismiss

                // -------------------------------------------------------------
                // TEST 7: Insufficient Credits Validation
                // -------------------------------------------------------------
                const savedBalBeforeTest7 = gm.getBalance();
                gm.payoutManager.currentBalance = 15;
                gm.payoutManager.currentBet = 50;
                gm.state = 'Idle';
                gm.requestSpin();
                assert(gm.getBalance() === 15, 'T29_InsufficientCredits_BalanceIntact');
                assert(gm.getState() === 'InsufficientFunds', 'T30_InsufficientCredits_StateTransition');
                
                // Restore balance ledger integrity
                gm.payoutManager.currentBalance = savedBalBeforeTest7;
                gm.payoutManager.setBet(10);
                gm.state = 'Idle';

                // -------------------------------------------------------------
                // TEST 8: Auto-Spin Session & Cancellation
                // -------------------------------------------------------------
                gm.startAutoSpin(10);
                assert(gm.autoSpinActive === true, 'T31_AutoSpin_StartedActive');
                gm.stopAutoSpin();
                assert(gm.autoSpinActive === false, 'T32_AutoSpin_CancelledCleanly');
                gm.state = 'Idle';

                // -------------------------------------------------------------
                // TEST 9: Audio Controls (Mute / Unmute)
                // -------------------------------------------------------------
                const isMuted = gm.audio.toggleMute();
                assert(isMuted === true, 'T33_Audio_MutedProperly');
                const unmuted = gm.audio.toggleMute();
                assert(unmuted === false, 'T34_Audio_UnmutedProperly');

                // -------------------------------------------------------------
                // TEST 10: Strict Financial Invariant Conservation
                // Initial 1000 - TotalBets + TotalPayouts == CurrentBalance
                // -------------------------------------------------------------
                const formulaBal = gm.payoutManager.startingBalance - gm.payoutManager.totalBetsPlaced + gm.payoutManager.totalPayoutsAwarded;
                assert(gm.getBalance() === formulaBal, 'T35_FinancialInvariant_StrictBalanceConservation', 
                    `Starting(${gm.payoutManager.startingBalance}) - Bets(${gm.payoutManager.totalBetsPlaced}) + Wins(${gm.payoutManager.totalPayoutsAwarded}) == Current(${gm.getBalance()})`);

                // Mark completion in DOM for test runner scrapers
                document.body.setAttribute('data-tests-total', testReport.total);
                document.body.setAttribute('data-tests-passed', testReport.passed);
                document.body.setAttribute('data-tests-failed', testReport.failed);
                document.body.setAttribute('data-tests-status', testReport.failed === 0 ? 'SUCCESS' : 'FAILURE');

            } catch (err) {
                assert(false, 'T00_FatalException', err.message);
                document.body.setAttribute('data-tests-status', 'EXCEPTION');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runComprehensiveTests();
        });
    </script>
</body>
</html>
