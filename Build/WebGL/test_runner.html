<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUCKY SPIN Browser In-Engine Automated Test Suite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Include complete slot game container -->
    <div id="game-container">
        <header id="header">
            <div class="brand-title">LUCKY SPIN</div>
            <div id="streak-badge" class="streak-badge">🔥 2x WIN STREAK!</div>
            <div class="audio-controls">
                <button id="btn-history">📜 History</button>
                <button id="btn-mute">🔊</button>
            </div>
        </header>

        <main id="slot-stage">
            <div id="cabinet">
                <div id="payline"></div>
                <div class="reel-frame">
                    <div id="reel-strip-1" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png"></div>
                    </div>
                </div>
                <div class="reel-frame">
                    <div id="reel-strip-2" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_diamond.png"></div>
                    </div>
                </div>
                <div class="reel-frame">
                    <div id="reel-strip-3" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png"></div>
                    </div>
                </div>
            </div>

            <aside id="side-panel">
                <div class="side-title">Quick Bet</div>
                <button class="btn-quick-bet active" data-bet="10">Bet 10G</button>
                <button class="btn-quick-bet" data-bet="50">Bet 50G</button>
                <button class="btn-quick-bet" data-bet="100">Bet 100G</button>
            </aside>
        </main>

        <div id="banner-container">
            <div id="win-banner">
                <div id="banner-title" class="win-title">READY</div>
                <div id="banner-amount" class="win-amount">SPIN TO WIN</div>
            </div>
        </div>

        <footer id="footer">
            <div class="hud-panel">
                <span class="hud-label">CREDITS</span>
                <span id="balance-display" class="hud-value">1000 G</span>
            </div>
            <div class="bet-controls">
                <div class="hud-panel">
                    <span class="hud-label">TOTAL BET</span>
                    <span id="bet-display" class="hud-value">10 G</span>
                </div>
                <button id="btn-bet-minus" class="btn-stepper">-</button>
                <button id="btn-bet-plus" class="btn-stepper">+</button>
                <button id="btn-max-bet" class="btn-secondary">MAX</button>
            </div>
            <div class="action-buttons">
                <button id="btn-auto-spin" class="btn-secondary">AUTO SPIN</button>
                <button id="btn-spin">SPIN</button>
            </div>
        </footer>

        <div id="jackpot-modal">
            <div class="jackpot-content">
                <div class="jackpot-marquee">💎 JACKPOT! 💎</div>
                <div id="jackpot-amount">+2500 G</div>
            </div>
        </div>

        <div id="history-drawer">
            <div class="history-header">
                <h2>SPIN HISTORY</h2>
                <button id="btn-close-history">✕</button>
            </div>
            <div id="history-summary">Spins: 0</div>
            <div id="history-items" class="history-list"></div>
        </div>

        <canvas id="particle-canvas"></canvas>
    </div>

    <!-- Automated Test Report Overlay -->
    <div id="test-results" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.85); border: 2px solid #00ffaa; color: #fff; padding: 15px; border-radius: 8px; font-family: monospace; z-index: 1000; max-width: 600px;">
        <h3 style="color: #00ffaa; margin-bottom: 8px;">WebGL In-Browser Automated Test Suite</h3>
        <div id="test-log">Initializing...</div>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
    <script>
        const logs = [];
        function log(msg, pass = true) {
            const prefix = pass ? '[PASS]' : '[FAIL]';
            logs.push({ text: `${prefix} ${msg}`, pass });
            const div = document.getElementById('test-log');
            if (div) {
                div.innerHTML = logs.map(l => `<div style="color: ${l.pass ? '#00ffaa' : '#ff4444'};">${l.text}</div>`).join('');
            }
            console.log(`${prefix} ${msg}`);
        }

        function runSynchronousBrowserTests() {
            try {
                const gm = window.gameManager;

                // Test 1: Initial Loading & Defaults
                log(`Initial State: ${gm.getState()} === 'Idle'`, gm.getState() === 'Idle');
                log(`Initial Balance: ${gm.getBalance()} === 1000 G`, gm.getBalance() === 1000);
                log(`Initial Bet: ${gm.getCurrentBet()} === 10 G`, gm.getCurrentBet() === 10);

                // Test 2: Bet Adjustments & Limits
                gm.payoutManager.increaseBet();
                log(`Increase Bet: Current Bet = ${gm.getCurrentBet()} G`, gm.getCurrentBet() === 20);
                gm.payoutManager.setBet(50);
                log(`Quick Bet 50G: Current Bet = ${gm.getCurrentBet()} G`, gm.getCurrentBet() === 50);

                // Test 3: Spin Execution & Atomic Deduction
                log(`Dispatching Spin with Bet: ${gm.getCurrentBet()} G...`);
                gm.requestSpin();
                log(`State changed to Spinning: ${gm.getState() === 'Spinning'}`, gm.getState() === 'Spinning');
                log(`Atomic Debit: Balance = ${gm.getBalance()} G (1000 - 50 = 950)`, gm.getBalance() === 950);
                log(`Spin Button Disabled: ${document.getElementById('btn-spin').disabled}`, document.getElementById('btn-spin').disabled);

                // Test 4: Complete Reel Stopping & Payout Processing
                gm.handleSpinCompleted();
                log(`State after Spin Settlement: ${gm.getState()}`, gm.getState() === 'Idle' || gm.getState() === 'Payout' || gm.getState() === 'Evaluating');
                const lastRes = gm.getLastResult();
                log(`Evaluation Result valid: Win=${lastRes.isWin}`, lastRes !== null);
                log(`Spin History Recorded: Count = ${gm.getHistory().length}`, gm.getHistory().length === 1);
                log(`Financial Invariant Valid: Balance = ${gm.getBalance()} G`, gm.getBalance() >= 0);

                // Test 5: Audio Mute & Volume
                const muted = gm.audio.toggleMute();
                log(`Audio Mute Toggle: IsMuted = ${muted}`, muted === true);
                gm.audio.toggleMute();
                log(`Audio Unmuted: IsMuted = ${gm.audio.isMuted}`, gm.audio.isMuted === false);

                // Test 6: Auto-Spin Low Credit Safety
                gm.payoutManager.currentBalance = 5;
                gm.payoutManager.currentBet = 10;
                const canAuto = gm.payoutManager.hasSufficientCredits();
                log(`Low Credit Auto-Spin Blocked: HasCredits = ${canAuto}`, canAuto === false);

                // Mark completion in DOM attribute for test scraper
                document.body.setAttribute('data-tests-completed', 'true');
                const allPassed = logs.every(l => l.pass);
                document.body.setAttribute('data-tests-passed', allPassed ? 'true' : 'false');
                log(`=== ALL BROWSER IN-ENGINE TESTS COMPLETED: ${allPassed ? 'ALL PASSED' : 'FAILURES OCCURRED'} ===`, allPassed);
            } catch (err) {
                log(`Exception in browser tests: ${err.message}`, false);
                document.body.setAttribute('data-tests-completed', 'true');
                document.body.setAttribute('data-tests-passed', 'false');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            runSynchronousBrowserTests();
        });
    </script>
</body>
</html>
