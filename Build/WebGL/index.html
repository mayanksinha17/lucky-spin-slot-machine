<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LUCKY SPIN – Ultimate Slot Machine (WebGL / HTML5)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Header -->
        <header id="header">
            <div class="brand-title">LUCKY SPIN</div>
            <div id="streak-badge" class="streak-badge">🔥 2x WIN STREAK!</div>
            <div class="audio-controls">
                <button id="btn-history" title="View Spin History">📜 History</button>
                <button id="btn-mute" title="Toggle Sound">🔊</button>
            </div>
        </header>

        <!-- Slot Machine Stage -->
        <main id="slot-stage">
            <div id="cabinet">
                <div id="payline"></div>

                <!-- Reel 1 -->
                <div class="reel-frame">
                    <div id="reel-strip-1" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png" alt="Reel 1 Slot 0"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png" alt="Reel 1 Slot 1"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Reel 1 Slot 2"></div>
                    </div>
                </div>

                <!-- Reel 2 -->
                <div class="reel-frame">
                    <div id="reel-strip-2" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bar.png" alt="Reel 2 Slot 0"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png" alt="Reel 2 Slot 1"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_diamond.png" alt="Reel 2 Slot 2"></div>
                    </div>
                </div>

                <!-- Reel 3 -->
                <div class="reel-frame">
                    <div id="reel-strip-3" class="reel-strip">
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_bell.png" alt="Reel 3 Slot 0"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_seven.png" alt="Reel 3 Slot 1"></div>
                        <div class="symbol-slot"><img src="Assets/Art/Symbols/symbol_cherry.png" alt="Reel 3 Slot 2"></div>
                    </div>
                </div>
            </div>

            <!-- Quick Bet Selection Panel (Matches Design Reference) -->
            <aside id="side-panel">
                <div class="side-title">Quick Bet</div>
                <button class="btn-quick-bet active" data-bet="10">Bet 10G</button>
                <button class="btn-quick-bet" data-bet="50">Bet 50G</button>
                <button class="btn-quick-bet" data-bet="100">Bet 100G</button>
            </aside>
        </main>

        <!-- Banner Notification Overlay -->
        <div id="banner-container">
            <div id="win-banner">
                <div id="banner-title" class="win-title">BIG WIN!</div>
                <div id="banner-amount" class="win-amount">+500 G</div>
            </div>
        </div>

        <!-- Footer HUD & Controls -->
        <footer id="footer">
            <div class="hud-panel">
                <span class="hud-label">CREDITS</span>
                <span id="balance-display" class="hud-value">1000 G</span>
            </div>

            <div class="bet-controls">
                <div class="hud-panel">
                    <span class="hud-label">TOTAL BET</span>
                    <span id="bet-display" class="hud-value">10 G</span>
                </div>
                <button id="btn-bet-minus" class="btn-stepper" title="Decrease Bet">-</button>
                <button id="btn-bet-plus" class="btn-stepper" title="Increase Bet">+</button>
                <button id="btn-max-bet" class="btn-secondary">MAX</button>
            </div>

            <div class="action-buttons">
                <button id="btn-auto-spin" class="btn-secondary">AUTO SPIN</button>
                <button id="btn-spin">SPIN</button>
            </div>
        </footer>

        <!-- Jackpot Celebration Modal -->
        <div id="jackpot-modal">
            <div class="jackpot-content">
                <div class="jackpot-marquee">💎 JACKPOT! 💎</div>
                <div id="jackpot-amount" style="font-size: 42px; font-weight: 900; color: #fff08a; margin: 15px 0;">+2500 G</div>
                <p style="color: #d8c1ff; font-size: 18px; margin-bottom: 20px;">DIAMOND TRIPLE MATCH!</p>
                <button class="btn-secondary" style="font-size: 18px; padding: 12px 30px;">COLLECT</button>
            </div>
        </div>

        <!-- History Drawer -->
        <div id="history-drawer">
            <div class="history-header">
                <h2>SPIN HISTORY</h2>
                <button id="btn-close-history" class="btn-secondary">✕</button>
            </div>
            <div id="history-summary" style="font-size: 13px; color: #ffd700; margin-top: 10px;">Spins: 0 | Wins: 0 (0%)</div>
            <div id="history-items" class="history-list"></div>
        </div>

        <!-- Canvas Particle Layer for Coin Fountains -->
        <canvas id="particle-canvas"></canvas>
    </div>

    <!-- Scripts -->
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
