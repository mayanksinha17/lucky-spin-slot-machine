<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | LUCKY SPIN – Ultimate Slot Machine</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css?v=2">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
        background-color: #06020e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      #unity-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background-color: #06020e;
      }

      #unity-container.unity-mobile {
        position: fixed;
        width: 100%;
        height: 100%;
      }

      #canvas-wrapper {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background: #0d081f;
      }

      #unity-canvas {
        background: #0d081f;
        display: block;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        cursor: default;
      }

      .unity-mobile #unity-canvas {
        width: 100%;
        height: 100%;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        z-index: 10;
        text-align: center;
      }

      #unity-logo {
        width: 154px;
        height: 130px;
        background: url('TemplateData/unity-logo-dark.png') no-repeat center;
        margin: 0 auto;
      }

      #unity-progress-bar-empty {
        width: 141px;
        height: 18px;
        margin-top: 10px;
        background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center;
        margin-left: auto;
        margin-right: auto;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 18px;
        background: url('TemplateData/progress-bar-full-dark.png') no-repeat center;
      }

      #unity-footer {
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        background: rgba(13, 8, 31, 0.95);
        border-top: 1px solid rgba(255, 215, 0, 0.2);
        padding: 0 12px;
      }

      .unity-mobile #unity-footer {
        display: none;
      }

      #unity-webgl-logo {
        width: 140px;
        height: 28px;
        background: url('TemplateData/webgl-logo.png') no-repeat left center;
        background-size: contain;
      }

      #unity-build-title {
        font-size: 13px;
        font-weight: 600;
        color: #ffdf7a;
        letter-spacing: 0.5px;
        text-align: center;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 8px;
      }

      #unity-fullscreen-button {
        cursor: pointer;
        width: 26px;
        height: 26px;
        background: url('TemplateData/fullscreen-button.png') no-repeat center;
        background-size: contain;
        opacity: 0.85;
        transition: opacity 0.2s, transform 0.15s;
      }

      #unity-fullscreen-button:hover {
        opacity: 1;
        transform: scale(1.08);
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 5%;
        transform: translate(-50%);
        background: rgba(20, 10, 35, 0.92);
        border: 1px solid #ffd700;
        color: #fff;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        display: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="canvas-wrapper">
        <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"> </div>
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button" title="Toggle Fullscreen"></div>
        <div id="unity-build-title">LUCKY SPIN – Ultimate Slot Machine</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var footer = document.querySelector("#unity-footer");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      function resizeGame() {
        var footerHeight = (footer && window.getComputedStyle(footer).display !== "none") ? (footer.offsetHeight || 38) : 0;
        var availW = window.innerWidth;
        var availH = window.innerHeight - footerHeight;

        if (availW <= 0 || availH <= 0) return;

        var targetAspect = 1920 / 1080;
        var availAspect = availW / availH;

        var w, h;
        if (availAspect > targetAspect) {
          h = Math.floor(availH);
          w = Math.floor(h * targetAspect);
        } else {
          w = Math.floor(availW);
          h = Math.floor(w / targetAspect);
        }

        canvas.style.width = w + "px";
        canvas.style.height = h + "px";

        if (footer) {
          footer.style.width = w + "px";
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data",
        frameworkUrl: buildUrl + "/WebGL.framework.js",
        codeUrl: buildUrl + "/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Underpin",
        productName: "LUCKY SPIN – Ultimate Slot Machine",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        resizeGame();
        window.addEventListener('resize', resizeGame);
        window.addEventListener('orientationchange', resizeGame);
        document.addEventListener('fullscreenchange', resizeGame);
        document.addEventListener('webkitfullscreenchange', resizeGame);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          if (!/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            resizeGame();
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
